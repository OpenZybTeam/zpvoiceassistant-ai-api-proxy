name = "iot-ai-proxy"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
# Public proxy: no device params here. Every caller supplies their own
# base64-encoded credential as the API key (Bearer token). See src/credential.js.
#
# Upstream IoT study assistant endpoint.
UPSTREAM_BASE = "https://iot-admin-iottest-e.suanshubang.com/iot-study/assistant"

# Default model when the request omits one.
DEFAULT_MODEL = "deepseek-v3"

# Persona preset injected into every request (see src/persona.js).
# plain / neutral / engineer / api / redteam / reference / unlock / malware / off
DEFAULT_PERSONA = "unlock"

# Per-model persona overrides, "model=preset,model=preset". Built-in table:
#   deepseek-v3 -> unlock, deepseek-r1 -> r1, baike -> baike
# Anything listed here wins over the built-in table.
# MODEL_PERSONA = "baike=reference,deepseek-r1=unlock"

# Single storage namespace. Holds everything that used to be hard-coded:
#   cfg:admin      admin password hash
#   tok:*          API tokens (sk-...), quota and expiry
#   sn:*           sn/secret pool
#   mem:*          per-chatId transcript (survives device rotation)
#   usage:*        per-token / per-device counters
# Create with: wrangler kv namespace create HISTORY
[[kv_namespaces]]
binding = "HISTORY"
id = "00000000000000000000000000000000"
